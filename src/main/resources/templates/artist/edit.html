<!DOCTYPE html>
<html lang="fr" xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
 layout:decorate="~{layouts/main}">
<head>
<title>Modification d'un artiste</title>
<style>
.fieldError { color: red; }
</style>
</head>
<body>
	<div class="container">
		<div id="notification" th:replace="~{layouts/main :: notification}"></div>
		<div layout:fragment="content">
			<h2 th:text="|${artist.firstname} ${artist.lastname}|">Bob Sull</h2>

			<form th:action="@{/artists/{id}/edit(id=${artist.id})}" th:object="${artist}" th:method="put">
				<div>
					<label>Id:</label>
					<span th:text="${artist.id}">1</span>
				</div>
				<div>
					<label>Firstname:</label>
					<input type="text" th:field="*{firstname}" th:errorclass="fieldError" maxlength="60" required>
					<p class="fieldError" th:if="${#fields.hasErrors('firstname')}" th:errors="*{firstname}"></p>
				</div>
				<div>
					<label>Lastname:</label>
					<input type="text" th:field="*{lastname}" th:errorclass="fieldError" maxlength="60" required>
					<p class="fieldError" th:if="${#fields.hasErrors('lastname')}" th:errors="*{lastname}"></p>
				</div>
				<div>
					<button type="submit">Modifier</button>
					<button type="reset">Réinitialiser</button>
					<a th:href="${back}">Annuler</a>
				</div>
			</form>

			<nav><a th:href="@{/artists}">Retour à l'index</a></nav>
		</div>
	</div>
</body>
</html>
